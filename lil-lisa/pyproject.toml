[project]
name = "lil-lisa"
version = "2.3.3"
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.9.5",
    "requests==2.31.0",
    "pyjwt==2.8.0",
    "python-dotenv==1.0.0",
    "slack_bolt==1.18.0",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "isort==5.12.0",
    "black==23.1.0",
    "flake8==6.0.0",
    "pylint==2.16.1",
    "mypy==1.0.0",
    "bandit[toml]==1.7.4",
]

[tool.isort]
profile = "black"
known_third_party = ["pydantic", "dotenv"]
known_first_party = ["shared"]
known_local_folder = ["src"]

[tool.black]
line-length = 119

[tool.pylint.messages_control]
max-line-length = 119
disable = ["line-too-long", "import-error", "R0801"]
ignored-classes = "scoped_session"

[tool.pylint.MASTER]
ignore-paths = ["^test/FOLDER_TO_IGNORE/.*$"]
extension-pkg-whitelist = ["pydantic"]

[tool.mypy]
exclude = 'FOLDER_TO_IGNORE'

[[tool.mypy.overrides]]
module = [
    "utils"
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["test"]
