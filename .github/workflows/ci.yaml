name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          docker system prune --all --force
      -
        name: Read versions
        id: versions
        run: |
          echo "server=$(python3 -c 'import tomllib; print(tomllib.load(open("LilLisa_Server/pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          echo "slack=$(python3 -c 'import tomllib; print(tomllib.load(open("lil-lisa/pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      -
        # :staging moves on every run. A pyproject version tag is published only
        # from main, and only when Docker Hub does not already have it, so a
        # later run (including a develop build of the same version) cannot
        # replace an image a deployment has pinned.
        name: Select image tags
        id: tags
        run: |
          set -euo pipefail
          server_tags="radiantone/rocknbot-server:staging"
          slack_tags="radiantone/rocknbot-slack:staging"

          version_tag_absent() {
            local image="$1"
            local output
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "::warning title=Version tag already published::${image} already exists and will not be overwritten"
              return 1
            fi
            if printf '%s\n' "$output" | grep -Eqi 'manifest unknown|: not found|no such manifest'; then
              return 0
            fi
            echo "::error title=Could not check version tag::Refusing to push ${image} because the registry check failed: ${output}"
            exit 1
          }

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            server_version="radiantone/rocknbot-server:${{ steps.versions.outputs.server }}"
            slack_version="radiantone/rocknbot-slack:${{ steps.versions.outputs.slack }}"
            if version_tag_absent "$server_version"; then
              server_tags="${server_tags}"$'\n'"${server_version}"
            fi
            if version_tag_absent "$slack_version"; then
              slack_tags="${slack_tags}"$'\n'"${slack_version}"
            fi
          else
            echo "Not on main (${GITHUB_REF}); publishing staging tags only"
          fi

          {
            echo "server<<EOF"
            printf '%s\n' "$server_tags"
            echo "EOF"
            echo "slack<<EOF"
            printf '%s\n' "$slack_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: LilLisa_Server/build/dockerfile_prod
          context: LilLisa_Server
          tags: ${{ steps.tags.outputs.server }}
          provenance: true
          sbom: true
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: lil-lisa-web/build/Dockerfile_prod
          context: lil-lisa-web
          tags: radiantone/rocknbot-web:staging
          provenance: true
          sbom: true
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: lil-lisa/build/dockerfile_prod
          context: lil-lisa
          tags: ${{ steps.tags.outputs.slack }}
          provenance: true
          sbom: true
